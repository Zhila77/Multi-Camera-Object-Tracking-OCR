[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaigle"
version = "0.1.0"
description = "Multi-camera computer vision pipeline"
requires-python = ">=3.11"
dependencies = [
    # Core async
    "uvloop>=0.19",
    # Video / image
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
    "ultralytics>=8.0",
    # Transport
    "redis[asyncio]>=5.0",
    # Inference service
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Config
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    # Models & validation
    "pydantic>=2.0",
    # Observability
    "structlog>=24.0",
    "prometheus-client>=0.20",
    # Serialization
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
